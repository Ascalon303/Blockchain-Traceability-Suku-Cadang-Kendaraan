x-node: &node
  build: .
  stdin_open: true
  tty: true
  networks: [blockchain-net]

services:
  node1:
    <<: *node
    container_name: node1
    command: ["--port","9001","--authors","Produsen",
              "--peers","node2:9002","node3:9003","node4:9004","node5:9005"]
    ports: ["9001:9001"]
    volumes: ["./data/node1:/app/data_9001"]
  node2:
    <<: *node
    container_name: node2
    command: ["--port","9002","--authors","Distributor",
              "--peers","node1:9001","node3:9003","node4:9004","node5:9005"]
    ports: ["9002:9002"]
    volumes: ["./data/node2:/app/data_9002"]
  node3:
    <<: *node
    container_name: node3
    command: ["--port","9003","--authors","Dealer",
              "--peers","node1:9001","node2:9002","node4:9004","node5:9005"]
    ports: ["9003:9003"]
    volumes: ["./data/node3:/app/data_9003"]
  node4:
    <<: *node
    container_name: node4
    command: ["--port","9004","--authors","Bengkel",
              "--peers","node1:9001","node2:9002","node3:9003","node5:9005"]
    ports: ["9004:9004"]
    volumes: ["./data/node4:/app/data_9004"]
  node5:
    <<: *node
    container_name: node5
    command: ["--port","9005",
              "--peers","node1:9001","node2:9002","node3:9003","node4:9004"]
    ports: ["9005:9005"]
    volumes: ["./data/node5:/app/data_9005"]

networks:
  blockchain-net:
    driver: bridge